<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link href="https://fonts.googleapis.com/css?family=Montserrat:200,300,500|Cairo:400,600&amp;subset=arabic,latin&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    -webkit-transition: background 1s;
    transition: background 1s;
  }

  /* ---------- Themes ---------- */
  body.t0 { background: #000; background: radial-gradient(circle at center, #3a2c12 0%, #0a0703 60%, #000 100%); }
  body.t0 #time { color: #f7dc9a; text-shadow: 0 0 40px rgba(247,220,154,0.35); }
  body.t0 #sec, body.t0 .colon { color: #c9a24b; }
  body.t0 #line { background: #c9a24b; }
  body.t0 #date { color: #ead9ae; }

  body.t1 { background: #02060f; background: radial-gradient(circle at center, #0f3a66 0%, #05182c 60%, #02060f 100%); }
  body.t1 #time { color: #eaf8ff; text-shadow: 0 0 40px rgba(79,209,255,0.45); }
  body.t1 #sec, body.t1 .colon { color: #4fd1ff; }
  body.t1 #line { background: #4fd1ff; }
  body.t1 #date { color: #a5dcf2; }

  body.t2 { background: #12051c; background: radial-gradient(circle at center, #4a1a63 0%, #250a35 60%, #12051c 100%); }
  body.t2 #time { color: #fff1e8; text-shadow: 0 0 40px rgba(255,126,179,0.45); }
  body.t2 #sec, body.t2 .colon { color: #ff7eb3; }
  body.t2 #line { background: #ff9a6c; }
  body.t2 #date { color: #ffc9b0; }

  body.t3 { background: #020d0a; background: radial-gradient(circle at center, #0d4a39 0%, #06231b 60%, #020d0a 100%); }
  body.t3 #time { color: #ecfff6; text-shadow: 0 0 40px rgba(76,255,176,0.4); }
  body.t3 #sec, body.t3 .colon { color: #4cffb0; }
  body.t3 #line { background: #4cffb0; }
  body.t3 #date { color: #a9ead0; }

  /* ---------- Layout ---------- */
  #wrap {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    -webkit-transform: translateY(-52%);
    transform: translateY(-52%);
  }
  #time {
    font-size: 24vw;
    font-weight: 300;
    line-height: 1;
    letter-spacing: 0.01em;
    white-space: nowrap;
    direction: ltr;
  }
  .colon {
    display: inline-block;
    font-weight: 200;
    margin: 0 0.02em;
    position: relative;
    top: -0.04em;
    -webkit-animation: blink 2s infinite;
    animation: blink 2s infinite;
  }
  @-webkit-keyframes blink { 0%, 55% { opacity: 1; } 75%, 100% { opacity: 0.25; } }
  @keyframes blink { 0%, 55% { opacity: 1; } 75%, 100% { opacity: 0.25; } }

  #sec {
    display: inline-block;
    width: 1.9em;
    text-align: left;
    font-size: 0.32em;
    font-weight: 200;
    margin-left: 0.25em;
    vertical-align: baseline;
  }
  #sec.off { display: none; }

  #line {
    width: 12vw;
    height: 0.5vw;
    margin: 2.2vw auto 2.6vw auto;
    border-radius: 1vw;
    opacity: 0.9;
  }
  #date {
    font-family: 'Cairo', 'Montserrat', Arial, sans-serif;
    font-size: 5vw;
    font-weight: 600;
    direction: rtl;
    letter-spacing: 0.02em;
  }
  #hint {
    position: absolute;
    bottom: 2vw;
    width: 100%;
    font-family: 'Cairo', Arial, sans-serif;
    font-size: 1.7vw;
    color: #ffffff;
    opacity: 0.45;
    direction: rtl;
    -webkit-transition: opacity 2s;
    transition: opacity 2s;
  }
</style>
</head>
<body class="t0">

<div id="wrap">
  <div id="time"><span id="hm">00<span class="colon">:</span>00</span><span id="sec">00</span></div>
  <div id="line"></div>
  <div id="date"></div>
</div>

<div id="hint">الأزرار الملونة (أحمر / أخضر / أصفر / أزرق) لتغيير الألوان &nbsp;•&nbsp; 0 : نظام 12 / 24 ساعة &nbsp;•&nbsp; OK : إظهار / إخفاء الثواني</div>

<script>
  var days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  // Tunisian month names
  var months = ["جانفي", "فيفري", "مارس", "أفريل", "ماي", "جوان",
                "جويلية", "أوت", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

  var use24 = true;
  var showSec = true;
  var theme = 0;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function applyTheme(i) {
    theme = i;
    document.body.className = "t" + i;
    try { localStorage.setItem("clockTheme", String(i)); } catch (e) {}
  }

  function tick() {
    var d = new Date();
    var h = d.getHours();
    var ap = "";
    if (!use24) {
      ap = h >= 12 ? " م" : " ص";
      h = h % 12;
      if (h === 0) { h = 12; }
    }
    document.getElementById("hm").innerHTML =
      pad(h) + '<span class="colon">:</span>' + pad(d.getMinutes());

    var s = document.getElementById("sec");
    s.className = showSec ? "" : "off";
    s.innerHTML = pad(d.getSeconds()) + (ap ? "<small>" + ap + "</small>" : "");

    document.getElementById("date").innerHTML =
      days[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  }

  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    // Samsung color keys: red 403, green 404, yellow 405, blue 406
    if (k === 403 || k === 49) { applyTheme(0); }
    else if (k === 404 || k === 50) { applyTheme(1); }
    else if (k === 405 || k === 51) { applyTheme(2); }
    else if (k === 406 || k === 52) { applyTheme(3); }
    else if (k === 37 || k === 39) { applyTheme((theme + (k === 39 ? 1 : 3)) % 4); }
    else if (k === 48) { use24 = !use24; tick(); }
    else if (k === 13) { showSec = !showSec; tick(); }
    showHint();
  });

  var hintTimer = null;
  function showHint() {
    var h = document.getElementById("hint");
    h.style.opacity = "0.45";
    if (hintTimer) { clearTimeout(hintTimer); }
    hintTimer = setTimeout(function () { h.style.opacity = "0"; }, 8000);
  }

  var saved = 0;
  try { saved = parseInt(localStorage.getItem("clockTheme"), 10) || 0; } catch (e) {}
  if (saved < 0 || saved > 3) { saved = 0; }
  applyTheme(saved);
  tick();
  setInterval(tick, 1000);
  showHint();
</script>
</body>
</html>
