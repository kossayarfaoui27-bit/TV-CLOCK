<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Clock</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
  }
  #wrap {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    -webkit-transform: translateY(-50%);
    transform: translateY(-50%);
  }
  #time {
    font-size: 24vw;
    font-weight: bold;
    line-height: 1;
    letter-spacing: 0.02em;
  }
  #sec { font-size: 8vw; opacity: 0.7; }
  #date {
    font-size: 4vw;
    margin-top: 2vw;
    opacity: 0.8;
  }
  #hint {
    position: absolute;
    bottom: 1vw;
    width: 100%;
    font-size: 1.6vw;
    opacity: 0.3;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="time">00:00<span id="sec">:00</span></div>
  <div id="date"></div>
</div>
<div id="hint">Press RED/GREEN/YELLOW/BLUE or 1-4 to change theme. Press 0 for 12h/24h.</div>

<script>
  var themes = [
    { bg: "#000000", fg: "#ffffff" },   // dark
    { bg: "#0b1d3a", fg: "#7fd1ff" },   // blue
    { bg: "#101010", fg: "#39ff14" },   // green
    { bg: "#ffffff", fg: "#111111" }    // light
  ];
  var use24 = true;
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function applyTheme(i) {
    document.body.style.background = themes[i].bg;
    document.body.style.color = themes[i].fg;
    try { localStorage.setItem("clockTheme", i); } catch (e) {}
  }

  function tick() {
    var d = new Date();
    var h = d.getHours();
    var suffix = "";
    if (!use24) {
      suffix = h >= 12 ? " PM" : " AM";
      h = h % 12;
      if (h === 0) { h = 12; }
    }
    document.getElementById("time").innerHTML =
      pad(h) + ":" + pad(d.getMinutes()) +
      '<span id="sec">:' + pad(d.getSeconds()) + suffix + '</span>';
    document.getElementById("date").innerHTML =
      days[d.getDay()] + ", " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  }

  document.onkeydown = function (e) {
    var k = e.keyCode;
    // Samsung color keys: red 403, green 404, yellow 405, blue 406
    if (k === 403 || k === 49) { applyTheme(0); }
    else if (k === 404 || k === 50) { applyTheme(1); }
    else if (k === 405 || k === 51) { applyTheme(2); }
    else if (k === 406 || k === 52) { applyTheme(3); }
    else if (k === 48) { use24 = !use24; tick(); }
  };

  var saved = 0;
  try { saved = parseInt(localStorage.getItem("clockTheme"), 10) || 0; } catch (e) {}
  applyTheme(saved);
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
